services:
  qdrant:
    image: qdrant/qdrant:latest
    # Exposed to the host for local debugging (curl localhost:6333). Remove
    # this port mapping in a real deployment so Qdrant is only reachable
    # from inside the compose network, not the public internet.
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
